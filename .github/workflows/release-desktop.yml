name: release-desktop

# Unsigned desktop releases (v1 decision): AppImage (linux) + DMG (macOS).
# Triggers on a version tag; the mettled engine binary comes from the mettle
# repo's release for METTLE_RELEASE_TAG. Signing/notarization is a later,
# paid decision — artifacts are unsigned by design for now.

on:
  workflow_dispatch:
    inputs:
      mettle_release_tag:
        description: "mettle release tag to take `mettled` from (empty = latest)"
        required: false
        default: ""
  push:
    tags: ["v*"]
  pull_request:
    paths: ["desktop/src-tauri/**", "packaging/**"]

permissions:
  contents: write

env:
  METTLE_REPO: adityam23/mettle

jobs:
  # Cheap gate that runs on PRs and dispatches: the Python suite (incl. the
  # supervision lifecycle) and a compile-only check of the Rust shell. The
  # full bundle build stays tag-gated — it needs the mettled release asset.
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux prerequisites (Tauri v2 + link check)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file \
            libxdo-dev libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Test suite
        run: uv run pytest -q
      - name: Supervision lifecycle smoke
        run: timeout 300 uv run python benchmarks/smoke_supervision.py
      # resources/ is gitignored (fetched/built per-matrix in the desktop job),
      # but tauri-build's resource-copy step runs on every `cargo check` (not
      # just `tauri build`) and errors if these dirs don't exist on disk.
      - name: Stub bundle resources
        run: |
          mkdir -p desktop/src-tauri/resources/server/docket-server
          mkdir -p desktop/src-tauri/resources/engine
      - name: Rust shell compiles
        working-directory: desktop/src-tauri
        run: cargo check

  desktop:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            mettle_target: x86_64-unknown-linux-gnu
          - os: macos-14
            mettle_target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - uses: astral-sh/setup-uv@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file \
            libxdo-dev libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      # --- frontend -----------------------------------------------------------
      - name: Build SPA
        working-directory: docket/web/frontend
        run: npm ci --silent && npm run build --silent

      - name: Fetch mettled (${{ matrix.mettle_target }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.mettle_release_tag || '' }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view -R "$METTLE_REPO" --json tagName -q .tagName)
          fi
          mkdir -p /tmp/mettled
          gh release download "$TAG" -R "$METTLE_REPO" \
            --pattern "mettled-${{ matrix.mettle_target }}.tar.gz" --dir /tmp/mettled
          mkdir -p desktop/src-tauri/resources/engine
          tar -xzf /tmp/mettled/mettled-${{ matrix.mettle_target }}.tar.gz \
            -C desktop/src-tauri/resources/engine
          chmod +x desktop/src-tauri/resources/engine/mettled*

      # --- sidecar -------------------------------------------------------------
      - name: Build docket-server sidecar
        run: packaging/build-sidecar.sh

      - name: Stage sidecar as Tauri resource
        run: |
          mkdir -p desktop/src-tauri/resources/server
          cp -a dist/docket-server desktop/src-tauri/resources/server/docket-server

      # --- shell ---------------------------------------------------------------
      - name: Build desktop bundle (unsigned)
        working-directory: desktop/src-tauri
        # Pinned to the `tauri` version vendored in Cargo.lock (2.11.5): the
        # npm CLI and the Rust `tauri` crate are released in lockstep, and an
        # unpinned `@latest` can drift ahead of the generator/runtime this
        # crate actually links against.
        run: npx --yes @tauri-apps/cli@2.11.5 build

      - name: Collect artifacts
        run: |
          mkdir -p release
          find desktop/src-tauri/target/release/bundle \
            \( -name "*.AppImage" -o -name "*.dmg" -o -name "*.app.tar.gz" \) \
            -exec cp {} release/ \;
          ls -la release/

      # Tag builds: publish straight to the tag's GitHub Release (the
      # no-updater decision means users fetch bundles from Releases, not CI
      # artifacts). release.yml creates/updates that same release off the
      # same tag push; softprops/action-gh-release retries as an update on
      # the "already_exists" 422 it gets if that job wins the race to create
      # it first, so running both against the same tag is safe either order.
      - name: Publish to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*

      # workflow_dispatch runs (manual, exploratory): no tag/release to
      # attach to, so keep the 90-day artifact for download.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: docket-desktop-${{ matrix.os }}
          path: release/*
